name: Scan and publish

on:
  schedule:
    # Every 6 hours, off the hour. GitHub says the start of the hour is when runs get delayed.
    # Each source's own cadence still decides whether it's read on a given run.
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Check every source, even ones not due or paused
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "config/**"
      - "franky/**"
      - "site/**"
      - "tests/**"
      - "ci/**"
      - ".github/workflows/scan.yml"

permissions:
  contents: read

# One at a time, because two runs at once would race to save the history.
concurrency:
  group: scan-and-publish
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # To save history to scan-state and publish to gh-pages.
      pages: write # To ask GitHub Pages to rebuild.
    steps:
      # Actions are pinned to exact commits, so a moved tag can't change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tests
        # On code changes only. A scheduled scan shouldn't stop because of a flaky test.
        if: github.event_name == 'push'
        run: python3 -m unittest discover -s tests -t .

      - name: Restore scan history
        run: ci/state.sh restore .state

      - name: Scan sources and build the site
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            python3 -m franky run --state-dir .state --out dist --force
          else
            python3 -m franky run --state-dir .state --out dist
          fi

      - name: Save scan history
        run: ci/state.sh save .state

      - name: Publish the site to gh-pages
        run: ci/publish.sh dist

      - name: Ask GitHub Pages to rebuild
        # GitHub's docs say pushes made with this workflow's token don't start a Pages build.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
